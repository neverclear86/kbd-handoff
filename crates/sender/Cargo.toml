[package]
name = "kbd-handoff-sender"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kbd-handoff-core.workspace = true
# Not the workspace entry: that one enables tokio's `signal` feature for the
# receiver, and its driver costs the resident sender 20 to 40 kB of private
# memory (see src/signals.rs). Build the sender with `-p kbd-handoff-sender`:
# building the whole workspace at once unifies the features and brings the
# driver back. 1.54 is needed for `AsyncFd::register_with_interest`.
tokio = { version = "1.54", features = ["rt", "macros", "net", "time", "sync"] }
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = ["tokio"] }
# Same version as the one evdev depends on, so no second copy is built.
nix = { version = "0.29", default-features = false, features = ["signal"] }
